# Runs the native Swift parity suite (`app/ios/Tests/FinanceParityTests`) with
# `swift test`. The suite covers the pure financial models of ObolCore and the
# native store/sync/transport/security Core of ObolNativeRuntime; it needs no
# signing material, no simulator, and no web bundle.
#
# This is a separate workflow on purpose: ios-testflight.yml stays manual-only
# because it archives and uploads a signed build, while the parity suite has to
# run on every change under app/ios. Package resolution uses the committed
# LOCAL Swift packages only (app/ios/Package.swift and app/ios/ObolCore).
name: ios swift test

on:
  push:
    paths:
      - 'app/ios/**'
      - '.github/workflows/ios-swift-test.yml'
  workflow_dispatch:

concurrency:
  group: ios-swift-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  swift-parity:
    name: swift parity suite
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app/ios
    steps:
      - uses: actions/checkout@v7

      - name: show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: resolve the Xcode project
        run: xcodebuild -list -project App/App.xcodeproj

      - name: run the parity suite
        run: swift test
