# Builds an App Store-signed archive of the NATIVE Obol iOS app and uploads
# it to TestFlight. The native app has no web bundle: no Node step and no web
# asset generation run here.
#
# Manual only. Run it from the Actions tab or with:
#   gh workflow run ios-testflight.yml --repo <owner>/<repo> -f build_number=123
#
# Required repository secrets:
#   APPLE_TEAM_ID                        Apple Developer Team ID
#   ASC_KEY_ID                           App Store Connect API Key ID
#   ASC_ISSUER_ID                        App Store Connect Issuer ID
#   ASC_KEY_P8_BASE64                    base64 of AuthKey_<KEY_ID>.p8
#   IOS_DISTRIBUTION_CERT_P12_BASE64     base64 of the Apple Distribution .p12
#   IOS_DISTRIBUTION_CERT_PASSWORD       password for that .p12
#
# The same build runs locally with `bash app/scripts/ios-testflight.sh` (see
# docs/ios-testflight.md); this workflow only provides the macOS toolchain and
# the signing material. Package resolution uses the committed LOCAL Swift
# packages (app/ios/ObolCore and app/ios/Package.swift), so no remote package
# secret is needed.
name: ios testflight

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: CFBundleVersion (numeric; defaults to a UTC timestamp)
        required: false
        type: string
      upload:
        description: Upload the IPA to TestFlight
        required: false
        default: true
        type: boolean

concurrency:
  group: ios-testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  testflight:
    name: archive and upload
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: show toolchain
        run: |
          xcodebuild -version
          xcrun altool --version

      - name: install App Store Connect key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          [ -n "$ASC_KEY_ID" ] || { echo "::error::ASC_KEY_ID is not set"; exit 1; }
          [ -n "$ASC_KEY_P8_BASE64" ] || { echo "::error::ASC_KEY_P8_BASE64 is not set"; exit 1; }
          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: import distribution certificate
        env:
          CERT_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
        run: |
          [ -n "$CERT_BASE64" ] || { echo "::error::IOS_DISTRIBUTION_CERT_P12_BASE64 is not set"; exit 1; }
          [ -n "$CERT_PASSWORD" ] || { echo "::error::IOS_DISTRIBUTION_CERT_PASSWORD is not set"; exit 1; }
          KEYCHAIN_PATH="$RUNNER_TEMP/obol-ios.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          existing="$(security list-keychains -d user | tr -d '"')"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $existing
          security default-keychain -s "$KEYCHAIN_PATH"
          printf '%s' "$CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          security import "$RUNNER_TEMP/distribution.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          rm -f "$RUNNER_TEMP/distribution.p12"
          {
            echo "KEYCHAIN_PATH=$KEYCHAIN_PATH"
            echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: build and upload
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          BUILD_NUMBER: ${{ github.event.inputs.build_number }}
          SKIP_UPLOAD: ${{ github.event.inputs.upload == 'false' && '1' || '0' }}
        run: bash app/scripts/ios-testflight.sh

      - name: upload build artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-testflight
          path: |
            app/ios/build/testflight/export/*.ipa
            app/ios/build/testflight/Obol.xcarchive/dSYMs
          if-no-files-found: warn
          retention-days: 7

      - name: remove the temporary keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          fi
