# When a pull request is merged into `main`, creates the branch `release-<version>` at the merge
# commit (the version is `desktop/app.json`'s) and starts `release.yml` on it. Two origins:
# `dev` (the standing integration branch) and `pr/release-<version>` (a release branch made out
# of band; its suffix must match `desktop/app.json`, or the job refuses to publish).
#
# A branch pushed with GITHUB_TOKEN does not start other workflows (GitHub's rule against
# loops), so the `push` trigger of release.yml would not fire; this job dispatches it explicitly
# instead, which GitHub allows.
name: release branch

on:
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: release-branch
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  branch:
    name: create release-<version>
    if: >-
      github.event.pull_request.merged == true &&
      (github.event.pull_request.head.ref == 'dev' ||
       startsWith(github.event.pull_request.head.ref, 'pr/release-'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - id: version
        name: read version
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          version=$(jq -r '.version' desktop/app.json)
          # semver, plus hotfix letters right after the patch: 0.1.0a, 0.1.0b.
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+[a-z]*([-+].*)?$ ]]; then
            echo "::error file=desktop/app.json::version '$version' is not X.Y.Z or X.Y.Z<letters> (a hotfix, as in 0.1.0a)"
            exit 1
          fi
          # A pr/release-<version> merge must carry the matching desktop/app.json: publishing a
          # branch that claims one version but internally says another would overwrite the
          # release assets the announced version's installed apps read.
          case "$HEAD_REF" in
            pr/release-*)
              expected="${HEAD_REF#pr/release-}"
              if [ "$expected" != "$version" ]; then
                echo "::error file=desktop/app.json::$HEAD_REF says $expected but desktop/app.json says $version"
                exit 1
              fi
              ;;
          esac
          echo "branch=release-$version" >> "$GITHUB_OUTPUT"
          echo "head_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"

      # An existing release branch means the version was not bumped: publishing again under the
      # same version would replace that release's files, and installed apps would not update.
      # That is a human decision, so the job stops instead.
      - name: create the branch
        env:
          BRANCH: ${{ steps.version.outputs.branch }}
        run: |
          # Match the full ref: the short pattern also matches `pr/release-<version>`.
          if git ls-remote --exit-code --heads origin "refs/heads/$BRANCH" > /dev/null; then
            echo "::error::$BRANCH already exists — bump version in desktop/app.json, or push $BRANCH by hand to republish"
            exit 1
          fi
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "created $BRANCH at $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: start the release
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.version.outputs.branch }}
        run: |
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
          echo "release.yml dispatched on $BRANCH" >> "$GITHUB_STEP_SUMMARY"
