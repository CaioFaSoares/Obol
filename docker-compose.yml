version: '3.8'

services:
  # 1. App (Nuxt 3)
  obol-app:
    build:
      context: ./app
      dockerfile: Dockerfile.dev
    container_name: obol-nuxt
    ports:
      - "13000:13000"
    environment:
      - PORT=13000
      - NUXT_PUBLIC_API_BASE=http://obol-server:13080 # Comunicação via rede interna
    volumes:
      - ./app:/app
      - /app/node_modules
      - /app/.nuxt
    networks:
      - obol_net
    depends_on:
      - obol-server

  # 2. Server (ElysiaJS no Bun)
  obol-server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: obol-elysia
    ports:
      - "13080:13080"
    environment:
      - PORT=13080
      - POCKETBASE_URL=http://obol-database:13090 # Comunicação interna com o banco
      - PB_ADMIN_EMAIL=${PB_ADMIN_EMAIL:-caio@copland.studio}
      - PB_ADMIN_PASSWORD=${PB_ADMIN_PASSWORD:-sua_senha_forte_aqui}
    volumes:
      - ./server:/app
      - /app/node_modules
    networks:
      - obol_net
    depends_on:
      - obol-database

  # 3. Banco de Dados (PocketBase)
  obol-database:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: obol-pocketbase
    ports:
      - "13090:13090" # Portal de Admin acessível em http://localhost:13090/_/
    environment:
      # Variáveis que nosso script de migração vai ler
      - PB_ADMIN_EMAIL=${PB_ADMIN_EMAIL:-caio@copland.studio}
      - PB_ADMIN_PASSWORD=${PB_ADMIN_PASSWORD:-sua_senha_forte_aqui}
    volumes:
      - ./db/pb_data:/pb_data
      - ./db/pb_migrations:/pb_migrations # Aqui vai a nossa magia
    networks:
      - obol_net
    command: [ "serve", "--http=0.0.0.0:13090", "--dir=/pb_data", "--migrationsDir=/pb_migrations" ]

  # 4. Laboratório de Desenvolvimento (Notas Markdown)
  obol-docs:
    image: zefhemel/silverbullet
    container_name: obol-silverbullet
    ports:
      - "13030:3000" # Acessível em http://localhost:13030
    volumes:
      - ./docs:/space # Seus arquivos .md ficam salvos nesta pasta do projeto
    networks:
      - obol_net

networks:
  obol_net:
    driver: bridge
